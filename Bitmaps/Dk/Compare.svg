<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<!-- Compare - the Tabler Icons "git-compare" glyph (two commit nodes joined by branch arrows).
     Source artwork: the same six paths as the RDCFlexTron library's "compare" glyph
     (FTDashIcons.pkg, DashIcon), which the FT Dashboard shows on its Compare Source chip.
     They were first taken from AppHtml\Svg\Compare.svg, removed 2026-09-29.

     This copy is the ICON MASTER for the DARK theme: open it in Axialis IconWorkshop and
     generate Compare.ico beside it.

     stroke="#D8D8D8" - the light grey of the Dk set (Dk\Compare.ico is #D7D7D7, Dk\Modernize.ico #D0D0D0).
     stroke-width="2" - the dashboard weight, not the 1.6 of the old AppHtml copy. On a 24 viewBox
     that is 1.33px at 16x16; 1.6 thins to ~1.07px and breaks up at the small sizes.

     The colour lives ONCE, on the <g> below - recolour by editing that single attribute. -->
<svg version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" width="24px" height="24px" viewBox="0 0 24 24" enable-background="new 0 0 24 24" xml:space="preserve">
  <g id="icon" fill="none" stroke="#D8D8D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 6m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/>
    <path d="M18 18m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/>
    <path d="M11 6h5a2 2 0 0 1 2 2v8"/>
    <path d="M14 9l-3 -3l3 -3"/>
    <path d="M13 18h-5a2 2 0 0 1 -2 -2v-8"/>
    <path d="M10 15l3 3l-3 3"/>
  </g>
</svg>
