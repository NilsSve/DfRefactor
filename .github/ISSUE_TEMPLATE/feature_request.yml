name: Feature request / suggestion
description: An idea, improvement, or a refactoring you wish DFRefactor did
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature or improvement.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: false
